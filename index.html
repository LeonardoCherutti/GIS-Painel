<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIS Painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f8fa; --surface:#ffffff; --surface-2:#f1f5f7; --ink:#0f1f26; --ink-2:#4b5d66; --ink-3:#8696a0;
  --line:#e3e9ed; --accent:#0e8fa3; --accent-2:#45b0c0; --accent-soft:#e3f4f7; --shadow:0 1px 2px rgba(15,31,38,.04),0 8px 24px rgba(15,31,38,.06);
  --shadow-h:0 2px 4px rgba(15,31,38,.05),0 16px 40px rgba(14,143,163,.16);
  --c-aps:#0e8fa3; --c-mac:#6d5bd0; --c-hosp:#e0795b;
  --radius:18px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1519; --surface:#121f25; --surface-2:#182a31; --ink:#eaf2f5; --ink-2:#9db0b9; --ink-3:#657983;
    --line:#223540; --accent:#45b0c0; --accent-soft:#12303a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --shadow-h:0 2px 4px rgba(0,0,0,.3),0 16px 40px rgba(69,176,192,.18);
    --c-aps:#45b0c0; --c-mac:#9a8cf0; --c-hosp:#f09a7e;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1519; --surface:#121f25; --surface-2:#182a31; --ink:#eaf2f5; --ink-2:#9db0b9; --ink-3:#657983;
  --line:#223540; --accent:#45b0c0; --accent-soft:#12303a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --shadow-h:0 2px 4px rgba(0,0,0,.3),0 16px 40px rgba(69,176,192,.18);
  --c-aps:#45b0c0; --c-mac:#9a8cf0; --c-hosp:#f09a7e;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:380px;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 300px at 15% -10%,var(--accent-soft),transparent 70%),radial-gradient(700px 260px at 90% -20%,color-mix(in srgb,var(--c-mac) 12%,transparent),transparent 70%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}

/* topo */
header{display:flex;align-items:center;gap:16px;padding:18px max(16px,calc((100% - 1160px)/2));position:sticky;top:0;z-index:5;
  backdrop-filter:saturate(1.4) blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid transparent;transition:border-color .2s}
header.rolou{border-color:var(--line)}
.marca{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:-.01em}
.marca i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent-2),var(--accent));display:grid;place-items:center;box-shadow:0 4px 12px rgba(14,143,163,.35)}
.marca i svg{width:16px;height:16px;stroke:#fff}
.marca small{font-weight:500;color:var(--ink-3);margin-left:2px}
.crumbs{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-3);margin-left:12px;min-width:0;overflow:hidden}
.crumbs button{padding:6px 10px;border-radius:8px;color:var(--ink-2);white-space:nowrap}
.crumbs button:hover{background:var(--surface-2)}
.crumbs .atual{color:var(--ink);font-weight:600;padding:6px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs svg{width:14px;height:14px;stroke:var(--ink-3);flex:none}
.sp{flex:1}
.tema{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface)}
.tema:hover{border-color:var(--accent)}
.tema svg{width:17px;height:17px;stroke:var(--ink-2)}

main{flex:1;width:100%;max-width:1160px;margin:0 auto;padding:28px 16px 56px}
.tela{animation:entra .35s ease both}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(28px,4vw,40px);line-height:1.1;letter-spacing:-.03em;font-weight:700;margin:10px 0 10px}
.lead{color:var(--ink-2);font-size:16px;line-height:1.55;max-width:620px}

/* camada 1 */
.resumo{display:flex;gap:28px;margin:26px 0 8px;flex-wrap:wrap}
.resumo div{display:flex;flex-direction:column}
.resumo b{font-size:26px;letter-spacing:-.02em}
.resumo span{font-size:13px;color:var(--ink-3)}
.grade{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));margin-top:26px}
.card{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-h);border-color:color-mix(in srgb,var(--cor,var(--accent)) 45%,var(--line))}
.card:focus-visible,.btn:focus-visible,.chip:focus-visible,.tema:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tipo{--cor:var(--c-aps);min-height:236px}
.tipo[data-t=mac]{--cor:var(--c-mac)}.tipo[data-t=hosp]{--cor:var(--c-hosp)}
.tipo::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--cor) 16%,transparent),transparent 70%);pointer-events:none}
.sigla{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.08em;padding:5px 10px;border-radius:999px;
  color:var(--cor);background:color-mix(in srgb,var(--cor) 12%,transparent)}
.tipo h2{font-size:21px;letter-spacing:-.02em;line-height:1.2}
.tipo p{color:var(--ink-2);font-size:14.5px;line-height:1.5}
.rodape{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:6px}
.rodape .n{font-size:13px;color:var(--ink-3)}.rodape .n b{font-size:22px;color:var(--ink);letter-spacing:-.02em;margin-right:5px}
.seta{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--cor) 12%,transparent);transition:transform .2s}
.seta svg{width:16px;height:16px;stroke:var(--cor)}
.card:hover .seta{transform:translateX(3px)}

/* camada 2 */
.barra{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:24px 0 6px}
.busca{position:relative;flex:1;min-width:220px;max-width:380px}
.busca svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--ink-3)}
.busca input{width:100%;font:inherit;font-size:14.5px;color:var(--ink);padding:11px 14px 11px 38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:0;transition:border-color .15s,box-shadow .15s}
.busca input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:500;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);transition:all .15s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.contagem{font-size:13px;color:var(--ink-3);margin-left:auto}
.est{--cor:var(--c-aps);padding:20px;gap:12px;cursor:pointer}
.est[data-t=mac]{--cor:var(--c-mac)}.est[data-t=hosp]{--cor:var(--c-hosp)}
.est .topo{display:flex;align-items:flex-start;gap:12px}
.avatar{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:.02em;
  color:var(--cor);background:color-mix(in srgb,var(--cor) 12%,transparent)}
.est h3{font-size:16.5px;letter-spacing:-.015em;line-height:1.25;font-weight:600}
.est .sub{font-size:13px;color:var(--ink-3);margin-top:2px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.meta span{display:flex;align-items:center;gap:5px}
.meta svg{width:13px;height:13px;stroke:var(--ink-3)}
.sem{color:var(--ink-3)}
.status{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#1a9d6b}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 20%,transparent)}
.status.off{color:var(--ink-3)}
.vazio{grid-column:1/-1;text-align:center;padding:60px 0;color:var(--ink-3)}

/* camada 3 */
.visor{margin-top:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.visor-top{display:flex;align-items:center;gap:14px;padding:16px 20px;flex-wrap:wrap}
.visor-top h1{font-size:22px;margin:0;letter-spacing:-.02em}
.visor-top .sub{font-size:13px;color:var(--ink-3);margin-top:2px}
.acoes{margin-left:auto;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink);transition:all .15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08);color:#fff}
.btn svg{width:15px;height:15px;stroke:currentColor}
.quadro{position:relative;aspect-ratio:16/9;min-height:520px;background:var(--surface-2);border-top:1px solid var(--line)}
.quadro iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.carregando{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);font-size:14px}
.sembi{padding:70px 24px;text-align:center;color:var(--ink-2)}
.sembi b{display:block;font-size:18px;color:var(--ink);margin-bottom:6px}

/* camada 3 em largura total */
body.largo main{max-width:1560px;padding:20px 24px 32px}
body.largo header{padding-left:max(24px,calc((100% - 1560px)/2 + 24px));padding-right:max(24px,calc((100% - 1560px)/2 + 24px))}
body.largo .quadro{aspect-ratio:auto;height:calc(100vh - 250px);min-height:560px}

footer{padding:8px 16px;text-align:center;font-size:12.5px;color:var(--ink-3)}
@media (max-width:640px){
  .crumbs{display:none}.acoes{margin-left:0;width:100%}.quadro{min-height:420px;aspect-ratio:4/3}
  body.largo main{padding:16px 10px 24px}body.largo .quadro{height:auto;aspect-ratio:4/3;min-height:420px}
  .contagem{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const $ = (s, r=document) => r.querySelector(s);
const ICO = {
  seta:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>',
  busca:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
  ext:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  tela:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  voltar:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const comp = c => c ? `${c.slice(4,6)}/${c.slice(0,4)}` : '';
const periodo = p => p ? p.split(' a ').map(comp).join(' – ') : '';
const dataBr = d => d ? d.split('-').reverse().join('/') : '';
const tipo = id => DADOS.tipos.find(t => t.id === id);
const iniciais = s => s.split(/\s+/).filter(w => w.length>2).slice(0,2).map(w => w[0]).join('').toUpperCase() || s.slice(0,2).toUpperCase();
const estado = { uf: 'Todos', q: '' };

function crumbs(partes){
  $('#crumbs').innerHTML = partes.map((p,i) => {
    const ult = i === partes.length-1;
    return (i? ICO.chev : '') + (ult ? `<span class="atual">${esc(p.t)}</span>` : `<button data-go="${p.h}">${esc(p.t)}</button>`);
  }).join('');
}

/* Camada 1: tipos de estudo */
function telaTipos(){
  crumbs([{t:'Tipos de estudo'}]);
  const total = DADOS.tipos.reduce((n,t) => n + t.estudos.length, 0);
  const comBi = DADOS.tipos.reduce((n,t) => n + t.estudos.filter(e => e.link).length, 0);
  const munis = new Set(DADOS.tipos.flatMap(t => t.estudos.map(e => e.ibge).filter(Boolean))).size;
  $('#app').innerHTML = `<section class="tela">
    <div class="eyebrow">Estudos técnicos em gestão SUS</div>
    <h1>Escolha o tipo de estudo</h1>
    <p class="lead">Todos os estudos gerados, organizados por tipo. Abra um tipo, escolha o município ou o estabelecimento e veja o BI.</p>
    <div class="resumo">
      <div><b>${total}</b><span>estudos gerados</span></div>
      <div><b>${comBi}</b><span>com BI publicado</span></div>
      <div><b>${munis}</b><span>municípios</span></div>
    </div>
    <div class="grade">${DADOS.tipos.map(t => `
      <button class="card tipo" data-t="${t.id}" data-go="#/${t.id}">
        <span class="sigla">${esc(t.sigla)}</span>
        <h2>${esc(t.nome)}</h2><p>${esc(t.descricao)}</p>
        <div class="rodape"><span class="n"><b>${t.estudos.length}</b>${t.estudos.length===1?'estudo':'estudos'}</span><span class="seta">${ICO.seta}</span></div>
      </button>`).join('')}</div></section>`;
}

/* Camada 2: estudos gerados */
function telaEstudos(id){
  const t = tipo(id); if(!t) return location.hash = '#/';
  crumbs([{t:'Tipos de estudo',h:'#/'},{t:t.nome}]);
  const ufs = ['Todos', ...[...new Set(t.estudos.map(e => e.uf).filter(Boolean))].sort()];
  if(!ufs.includes(estado.uf)) estado.uf = 'Todos';
  $('#app').innerHTML = `<section class="tela">
    <div class="eyebrow">${esc(t.sigla)}</div>
    <h1>${esc(t.nome)}</h1>
    <p class="lead">${esc(t.descricao)}</p>
    <div class="barra">
      <label class="busca">${ICO.busca}<input id="q" type="search" placeholder="Buscar município ou estabelecimento" value="${esc(estado.q)}" autocomplete="off"></label>
      <div class="chips" id="chips">${ufs.map(u => `<button class="chip" aria-pressed="${u===estado.uf}" data-uf="${u}">${u}</button>`).join('')}</div>
      <span class="contagem" id="cont"></span>
    </div>
    <div class="grade" id="lista"></div></section>`;
  const pinta = () => {
    const q = norm(estado.q);
    const itens = t.estudos.filter(e => (estado.uf==='Todos' || e.uf===estado.uf) && norm(`${e.titulo} ${e.subtitulo} ${e.ibge}`).includes(q))
      .sort((a,b) => (b.publicado||'').localeCompare(a.publicado||'') || a.titulo.localeCompare(b.titulo));
    $('#cont').textContent = `${itens.length} de ${t.estudos.length}`;
    $('#lista').innerHTML = itens.length ? itens.map(e => `
      <article class="card est" data-t="${t.id}" tabindex="0" role="link" data-go="#/${t.id}/${encodeURIComponent(e.id)}">
        <div class="topo"><div class="avatar">${esc(e.uf || iniciais(e.titulo))}</div>
          <div><h3>${esc(e.titulo)}</h3><div class="sub">${esc(e.subtitulo)}</div></div></div>
        <div class="meta">
          ${e.periodo ? `<span>${ICO.cal}${esc(periodo(e.periodo))}</span>` : ''}
          ${e.detalhe ? `<span>${esc(e.detalhe)}</span>` : ''}
          ${e.publicado ? `<span class="sem">publicado ${dataBr(e.publicado)}</span>` : ''}
          <span class="status ${e.link?'':'off'}">${e.link?'BI publicado':'Sem BI'}</span>
        </div></article>`).join('') : `<div class="vazio">Nenhum estudo encontrado.</div>`;
  };
  pinta();
  $('#q').addEventListener('input', ev => { estado.q = ev.target.value; pinta(); });
  $('#chips').addEventListener('click', ev => {
    const b = ev.target.closest('[data-uf]'); if(!b) return;
    estado.uf = b.dataset.uf;
    document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c===b)); pinta();
  });
}

/* Camada 3: BI do estudo */
function telaBI(id, eid){
  const t = tipo(id); const e = t && t.estudos.find(x => x.id === eid);
  if(!e) return location.hash = '#/' + (t ? id : '');
  crumbs([{t:'Tipos de estudo',h:'#/'},{t:t.nome,h:'#/'+id},{t:e.titulo}]);
  $('#app').innerHTML = `<section class="tela">
    <div class="visor">
      <div class="visor-top">
        <div><div class="eyebrow">${esc(t.sigla)}</div><h1>${esc(e.titulo)}</h1><div class="sub">${esc(e.subtitulo)}${e.periodo?' · '+esc(periodo(e.periodo)):''}</div></div>
        ${e.link ? `<div class="acoes">
          <button class="btn" id="tela">${ICO.tela}Tela cheia</button>
          <a class="btn pri" href="${esc(e.link)}" target="_blank" rel="noopener">${ICO.ext}Abrir em nova aba</a></div>` : ''}
      </div>
      ${e.link ? `<div class="quadro" id="quadro"><div class="carregando">Carregando o BI…</div>
        <iframe src="${esc(e.link)}" title="BI ${esc(e.titulo)}" allowfullscreen loading="eager"></iframe></div>`
        : `<div class="sembi"><b>BI ainda não publicado</b>Este estudo foi gerado, mas não tem link público registrado.</div>`}
    </div></section>`;
  const tc = $('#tela'); if(tc) tc.onclick = () => $('#quadro').requestFullscreen?.();
}

function rota(){
  const [, id, eid] = location.hash.split('/');
  document.body.classList.toggle('largo', !!eid);
  if(!id) telaTipos(); else if(!eid) telaEstudos(id); else telaBI(id, decodeURIComponent(eid));
  scrollTo(0,0);
}
document.addEventListener('click', ev => {
  const g = ev.target.closest('[data-go]'); if(g) location.hash = g.dataset.go;
});
document.addEventListener('keydown', ev => {
  if(ev.key==='Enter' && ev.target.matches('.est')) location.hash = ev.target.dataset.go;
});
addEventListener('hashchange', rota);
addEventListener('scroll', () => $('#topo').classList.toggle('rolou', scrollY>4), {passive:true});

/* tema */
const raiz = document.documentElement;
try{ const s = localStorage.getItem('gis-tema'); if(s) raiz.dataset.theme = s; }catch(_){}
$('#tema').onclick = () => {
  const escuro = raiz.dataset.theme ? raiz.dataset.theme==='dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  raiz.dataset.theme = escuro ? 'light' : 'dark';
  try{ localStorage.setItem('gis-tema', raiz.dataset.theme); }catch(_){}
};
$('#rodape').textContent = `Atualizado em ${DADOS.gerado_em}`;
rota();
</script>
</body>
</html>
